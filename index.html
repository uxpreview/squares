<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE2CF">
<title>Squares</title>
<meta name="description" content="A hidden-object picture book you can walk through. Tiny animated places, drawn in code, each with a loose goose.">
<meta property="og:title" content="Squares">
<meta property="og:description" content="A hidden-object picture book you can walk through. Every place has a loose goose.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script>
  // A place printed on something other than paper (the Manor's night) colors
  // the page before anything draws: iOS Safari picks its bar colors early and
  // doesn't always look again, and the title shouldn't start on paper and
  // flip. The place is the one in the link, or on the title and the picker,
  // the last one you played (it drifts behind them). Must match each map's
  // plate.paper (the smoke test checks); play.js sets it for good once the
  // map loads.
  (function () {
    var plates = { manor: '#1F2749' };
    var id = location.hash.replace(/^#\/?/, '').split('/')[0];
    if (!id || id === 'maps') {
      try { id = JSON.parse(localStorage.getItem('squares.save.v4') || localStorage.getItem('squares.save.v3')).last.map; } catch (e) { id = ''; }
    }
    var p = plates[id];
    if (!p) return;
    document.documentElement.style.setProperty('--plate', p);
    document.documentElement.dataset.plate = 'night';
    document.querySelector('meta[name="theme-color"]').content = p;
  })();
</script>
</head>
<body data-screen="title" data-mode="overview">
<canvas id="map" aria-label="An isometric map of tiny animated places. Tap a place to step inside, then tap hidden things to circle them."></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="edge edge-top" aria-hidden="true"></div>
<div class="edge edge-bottom" aria-hidden="true"></div>
<!-- Measures the home bar and the bottom of the screen, for framing and the room bar. -->
<div id="safe" class="safe-probe" aria-hidden="true"></div>

<!-- ============ Title ============ -->
<section id="title" class="screen title" aria-labelledby="wordmark" hidden>
  <div class="title-top">
    <h1 id="wordmark" class="wordmark">Squares</h1>
    <p id="title-tagline" class="title-tagline"></p>
  </div>
  <div class="title-actions">
    <button id="title-play" class="big-btn" type="button">
      <span id="title-play-label">Play</span>
      <span id="title-play-sub" class="big-btn-sub" hidden></span>
    </button>
    <button id="title-places" class="soft-btn" type="button" hidden>All places</button>
    <p id="title-progress" class="title-progress" hidden></p>
  </div>
  <footer class="title-foot">
    <a id="back-link" class="brand-back" href="https://ryankm.com/lab">&larr; Lab</a>
    <button class="icon-btn sound-btn" type="button" aria-pressed="true" aria-label="Sound on">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </footer>
</section>

<!-- ============ Pick a place ============ -->
<section id="places" class="screen places" aria-labelledby="places-title" hidden>
  <header class="places-head">
    <button id="places-back" class="icon-btn" type="button" aria-label="Back to the title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div>
      <h2 id="places-title" class="places-title" tabindex="-1">Pick a place</h2>
      <p id="places-total" class="places-total"></p>
    </div>
  </header>
  <ul id="places-list" class="places-list"></ul>
</section>

<!-- ============ Playing ============ -->
<div id="hud" hidden>
  <header id="place" class="place">
    <button id="to-places" class="back-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="to-places-label">Places</span>
    </button>
    <h1 id="place-name" class="place-name"></h1>
    <p id="place-tagline" class="place-tagline"></p>
  </header>

  <div class="tally" aria-live="polite">
    <span class="tally-item" id="tally-geese-pill" title="Geese found">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17c0-4 3-6 7-6h2c0-3 1-6 4-6 1.6 0 2.5 1 2.5 2l2 .8-2 .8c0 2-1 3-2 4 1 2 .5 5-2 6.5-3 1.6-9 1.2-11.5-2.1z" fill="currentColor"/></svg>
      <span class="sr-only">Geese found: </span><span id="tally-geese">0/0</span>
    </span>
    <!-- Hints left to spend (earned by finding things). -->
    <span class="tally-item tally-hints" id="tally-hints-pill" role="img" title="Hints left">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3.5z" fill="currentColor"/><path d="M9.8 19h4.4M10.6 21.2h2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span id="tally-hints" aria-hidden="true">3</span>
    </span>
    <!-- Whodunits: the case file, with how much evidence you've found. -->
    <button id="tally-case" class="tally-item tally-case" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M14.7 14.7l5 5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
      <span class="tally-case-label">Case</span>
      <span id="tally-case-count">0/0</span>
    </button>
    <button class="icon-btn sound-btn tally-sound" type="button" aria-pressed="true" aria-label="Sound on">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- A place whose clock matters (the tide): what it says now, with a little
       gauge; a tap skips ahead to the next turn. play.js fills it in. -->
  <button id="dial" class="dial" type="button" hidden>
    <span class="dial-gauge" aria-hidden="true"><span class="dial-water"></span></span>
    <span class="dial-text" aria-hidden="true">
      <span id="dial-label" class="dial-label"></span>
      <span id="dial-next" class="dial-next"></span>
    </span>
  </button>

  <!-- A first visit: where to start, pinned to a room on the map (it rides
       along with the picture) until you step into one. -->
  <button id="invite" class="invite" type="button" hidden>
    <span class="invite-card">
      <span id="invite-title" class="invite-title"></span>
      <span id="invite-text" class="invite-text"></span>
    </span>
  </button>
  <span id="invite-ring" class="invite-ring" aria-hidden="true" hidden></span>

  <!-- Places with floors: a lift panel in the corner, every floor on it, top
       floor at the top, the one you're on lit. play.js builds the buttons. -->
  <nav id="floors" class="lift" aria-label="Floors" hidden></nav>

  <!-- Inside a zone: where you are, its story, and getting around. -->
  <nav id="roombar" class="roombar" aria-label="Where you are" hidden>
    <button id="prev" class="icon-btn" type="button" aria-label="Previous">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="room-pill" class="room-pill" type="button" aria-expanded="false" aria-controls="story">
      <span class="room-unit" id="room-unit"></span>
      <span class="room-name" id="room-name"></span>
      <svg class="room-info" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button id="next" class="icon-btn" type="button" aria-label="Next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </nav>
  <div id="story" class="story" hidden><p id="story-text"></p></div>

  <!-- The find list. Bottom of the screen on phones, docked right on wide screens.
       States: hidden (focus mode), peek (chips), open (the whole list). -->
  <section id="tray" class="tray" aria-label="Things to find" data-state="peek" hidden>
    <div class="tray-head">
      <button id="tray-grip" class="tray-grip" type="button" tabindex="-1" aria-hidden="true"></button>
      <div class="tray-title">
        <p class="tray-count" id="tray-count" aria-live="polite">0 of 4 found here</p>
        <p class="tray-place" id="tray-place"></p>
      </div>
      <button id="tray-hint" class="tray-hint" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3.5z" fill="currentColor"/><path d="M9.8 19h4.4M10.6 21.2h2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="tray-hint-label">Hint</span>
        <span id="tray-hint-count" class="tray-hint-count" aria-hidden="true">3</span>
      </button>
      <!-- (Side dock only: tuck the panel away. On a phone, swipe the list down.) -->
      <button id="tray-hide" class="icon-btn" type="button" aria-label="Hide the list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="tray-more" class="icon-btn" type="button" aria-label="Show the whole list" aria-expanded="false" aria-controls="tray-full">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <!-- A hint's line (or a hard find's riddle), for the thing picked on the list. -->
    <p id="tray-note" class="tray-note" aria-live="polite" hidden>
      <span id="tray-note-text"></span>
      <button id="tray-note-btn" class="tray-note-btn" type="button" hidden>Show me</button>
    </p>
    <ul id="tray-chips" class="chips"></ul>
    <div id="tray-full" class="tray-full"></div>
    <button id="tray-pill" class="tray-pill" type="button" aria-label="Show the list">
      <span id="tray-pips" class="pips" aria-hidden="true"></span>
      <span id="tray-left" class="pill-left">4 left to find</span>
      <span id="tray-frac" class="pill-frac" aria-hidden="true">0/4</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14.5l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </section>
</div>

<!-- ============ A place, finished ============ -->
<div id="complete" class="complete" role="dialog" aria-modal="false" aria-labelledby="complete-title" hidden>
  <p class="complete-kicker">Place complete</p>
  <h2 id="complete-title" class="complete-title"></h2>
  <p id="complete-text" class="complete-text"></p>
  <div class="complete-actions">
    <button id="complete-next" class="big-btn" type="button">Pick another place</button>
    <button id="complete-stay" class="soft-btn" type="button">Keep looking around</button>
  </div>
</div>

<!-- ============ A whodunit's case file ============ -->
<section id="case" class="case" role="dialog" aria-modal="true" aria-labelledby="case-title" hidden>
  <div class="case-sheet">
    <button class="icon-btn case-x" type="button" aria-label="Close the case file"></button>
    <div class="case-body"></div>
  </div>
</section>

<!-- A flash of lightning, for the moment the case closes. -->
<div id="flash" class="flash" aria-hidden="true" hidden></div>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
